runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  maxInstances: 10
  minInstances: 0

env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_PUBLIC_APP_DOMAIN
    value: "https://casanagringa.com"
  - variable: GEMINI_MODEL
    value: "gemini-3.8-flash"
  # Configure este segredo no Firebase CLI antes do deploy:
  # npx firebase-tools apphosting:secrets:set GEMINI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
